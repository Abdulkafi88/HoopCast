<!doctype html>

    <title>HoopCast — Live NBA Scores & Stats</title>

  <body>
    <div id="root">
      <div id="app-loader" style="
        position: fixed;
        inset: 0;
        background: #0f1117;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        z-index: 9999;
      ">
        <svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="animation: spin 1.5s linear infinite;" aria-hidden="true">
          <circle cx="50" cy="50" r="48" fill="#c1440e" stroke="#8B3000" stroke-width="2"/>
          <path d="M2 50 Q98 50 98 50" stroke="#8B3000" stroke-width="2.5" fill="none"/>
          <path d="M50 2 Q50 98 50 98" stroke="#8B3000" stroke-width="2.5" fill="none"/>
          <path d="M2 50 Q20 20 50 2" stroke="#8B3000" stroke-width="2.5" fill="none"/>
          <path d="M2 50 Q20 80 50 98" stroke="#8B3000" stroke-width="2.5" fill="none"/>
          <path d="M98 50 Q80 20 50 2" stroke="#8B3000" stroke-width="2.5" fill="none"/>
          <path d="M98 50 Q80 80 50 98" stroke="#8B3000" stroke-width="2.5" fill="none"/>
        </svg>
        <span style="color: #818cf8; font-family: Poppins, sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: 2px;">HoopCast</span>
      </div>
    </div>
    <style>
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
